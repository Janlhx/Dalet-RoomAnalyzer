[platformio]
default_envs = node_nw
description = Dalet-RoomAnalyzer Firmware Multi-Nodo con PlatformIO

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    closedcube/ClosedCube HDC1080 @ ~1.3.2
    bblanchon/ArduinoJson @ ^7.0.0

; ------------------------------------------------------------------------------
; Nodos basados en ESP32 / LilyGO
; ------------------------------------------------------------------------------
[esp32_base]
platform = espressif32
board = esp32dev

; Nodo 1: Esquina Noroeste (Ventana / Fachada Solar)
[env:node_nw]
extends = esp32_base
build_flags =
    -D NODE_ID="\"hdc1080_nw\""
    -D CORNER_NAME="\"Esquina Noroeste (Ventana)\""
    -D ROOM_NAME="\"Room:01\""

; Nodo 2: Esquina Noreste (Puerta de Acceso)
[env:node_ne]
extends = esp32_base
build_flags =
    -D NODE_ID="\"hdc1080_ne\""
    -D CORNER_NAME="\"Esquina Noreste (Puerta)\""
    -D ROOM_NAME="\"Room:01\""

; Nodo 3: Esquina Suroeste (Servidores / Carga Térmica)
[env:node_sw]
extends = esp32_base
build_flags =
    -D NODE_ID="\"hdc1080_sw\""
    -D CORNER_NAME="\"Esquina Suroeste (Servidores)\""
    -D ROOM_NAME="\"Room:01\""

; Nodo 4: Esquina Sureste (Climatizador AC)
[env:node_se]
extends = esp32_base
build_flags =
    -D NODE_ID="\"hdc1080_se\""
    -D CORNER_NAME="\"Esquina Sureste (AC Clima)\""
    -D ROOM_NAME="\"Room:01\""

; ------------------------------------------------------------------------------
; Soporte alternativo para ESP8266 (NodeMCU / D1 Mini)
; ------------------------------------------------------------------------------
[env:esp8266_nw]
platform = espressif8266
board = nodemcuv2
build_flags =
    -D NODE_ID="\"hdc1080_nw\""
    -D CORNER_NAME="\"Esquina Noroeste (Ventana)\""
    -D ROOM_NAME="\"Room:01\""
